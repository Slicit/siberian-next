# Development stack. Production topology is deliberately not this file: the
# Orchestrator creates module containers at runtime through the engine driver,
# it does not write compose files.
#
# What lives here is only the core. Modules never appear in this file.

name: siberian

x-rails-build: &rails_build
  context: ..
  dockerfile: deploy/rails.Dockerfile

x-rails-env: &rails_env
  SIBERIAN_DOMAIN: ${SIBERIAN_DOMAIN:-siberian.test}
  SIBERIAN_RESOLVER: ${SIBERIAN_RESOLVER:-127.0.0.11}
  RAILS_ENV: ${RAILS_ENV:-development}

# A ceiling for each Rails service, so a leak stops one container instead of the
# box. They sit around 100 MB each, so this is roughly seven times headroom: it
# is a bound on the pathological case, not a target to run near.
#
# Deliberately not a CPU cap. These services are waiting on Postgres and on each
# other almost all the time, and capping something that is already idle costs
# latency under load for no benefit. The thing that needed capping is the
# builder, which is genuinely CPU hungry and is capped where it is defined.
x-rails-limits: &rails_limits
  resources:
    limits:
      memory: ${SIBERIAN_RAILS_MEMORY:-768M}

services:
  configuration:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
    volumes:
      - configuration_data:/var/lib/postgresql/data
      - ../core/configuration/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  router:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: core/router/Dockerfile
    environment:
      SIBERIAN_DOMAIN: ${SIBERIAN_DOMAIN:-siberian.test}
      SIBERIAN_RESOLVER: ${SIBERIAN_RESOLVER:-127.0.0.11}
      # The ceiling on a module upload through the core door. Deliberately well
      # above the default bucket grant: the Storage service's quotas are what
      # should refuse an upload, because an operator sets those and can see
      # them, and nginx's own default of 1m refused everything larger with a
      # 413 that explained neither. Not unlimited, because a body big enough to
      # be a problem should still be stopped at the door.
      SIBERIAN_MAX_UPLOAD: ${SIBERIAN_MAX_UPLOAD:-1024m}
    ports:
      - "${SIBERIAN_HTTP_PORT:-80}:80"
      - "${SIBERIAN_HTTPS_PORT:-443}:443"
    volumes:
      # Written by the Orchestrator on install, read by nginx after a reload.
      # A shared volume rather than an API, because nginx reads files.
      - router_modules:/etc/nginx/conf.d/modules
      # Generated by bin/generate-certs. Never committed.
      - ../deploy/certs:/etc/nginx/certs:ro
    networks:
      core:
        # Module containers join this network with their short name as alias.
        # The Router resolves them by that alias and never learns the
        # uuid-prefixed container name.
        # The Router answers to three names on the core network: itself, the door
        # modules use to reach the core, and the door core services use to reach
        # a module. It is the only container on both sides, which is why.
        aliases: [router, core, modules]
      # Reachability, not authority. The Router forwards signed S3 requests to
      # Garage on s3.<domain> and holds no Garage credential of its own, so what
      # it can read is exactly what the client already had a valid signature
      # for. Garage refuses everything else, as it does for any caller.
      #
      # Without this the object store is unreachable from a browser, which
      # makes a presigned URL a URL to nowhere.
      storage:

  orchestrator:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: orchestrator
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_orchestrator
      SIBERIAN_ENGINE: docker
      SIBERIAN_AUTH_URL: http://auth:3000
      SIBERIAN_MAILER_URL: http://mailer:3000
      SIBERIAN_DATABASE_URL_SERVICE: http://database:3000
      SIBERIAN_STORAGE_URL: http://storage:3000
      SIBERIAN_MOBILE_URL: http://mobile:3000
      SIBERIAN_SERVICE_NAME: orchestrator
      # One secret per pair of services, not one per service.
      #
      # A single token per caller would still mean every callee has to know the
      # Orchestrator's token in order to check it, so compromising any one of
      # them would hand over the ability to act as the Orchestrator against all
      # the rest. Per pair, the most a compromised service learns is how to talk
      # to itself.
      #
      # The defaults are distinct rather than convenient: a shared default would
      # make development quietly behave like the thing this replaces, and the
      # first time anybody noticed would be in a deployment that inherited it.
      SIBERIAN_CALLERS: >-
        base=${SIBERIAN_TOKEN_BASE_ORCHESTRATOR:-dev_base_to_orchestrator},
        mailer=${SIBERIAN_TOKEN_MAILER_ORCHESTRATOR:-dev_mailer_to_orchestrator}
      SIBERIAN_CALLEES: >-
        storage=${SIBERIAN_TOKEN_ORCHESTRATOR_STORAGE:-dev_orchestrator_to_storage},
        database=${SIBERIAN_TOKEN_ORCHESTRATOR_DATABASE:-dev_orchestrator_to_database},
        mailer=${SIBERIAN_TOKEN_ORCHESTRATOR_MAILER:-dev_orchestrator_to_mailer},
        mobile=${SIBERIAN_TOKEN_ORCHESTRATOR_MOBILE:-dev_orchestrator_to_mobile},
        auth=${SIBERIAN_TOKEN_ORCHESTRATOR_AUTH:-dev_orchestrator_to_auth}
      # Joined to every module network so modules can reach Postgres directly.
      SIBERIAN_MODULEDB_CONTAINER: siberian-moduledb-1
      SIBERIAN_ROUTER_CONFIG_DIR: /var/lib/siberian/router
      SIBERIAN_ROUTER_CONTAINER: siberian-router-1
      # Where the Orchestrator looks for installable modules. A directory for
      # now; a registry later. Read only, because installing must never edit
      # the source it installed from.
      SIBERIAN_MODULE_CATALOG: /var/lib/siberian/modules
    volumes:
      - ../core/orchestrator:/app
      - ../lib:/app/lib
      # The Orchestrator drives the engine, so it is the one core service that
      # reaches the daemon. Nothing else gets the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - router_modules:/var/lib/siberian/router
      - ../modules:/var/lib/siberian/modules:ro
      # Written on the host by the nightly sweep, read here so the Overview can
      # show whether the last one passed. Read only: the Backoffice reports on
      # the checks and never writes their result.
      - ../deploy/checks:/var/lib/siberian/checks:ro
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  base:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: base
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_base
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_AUTH_URL: http://auth:3000
      SIBERIAN_SERVICE_NAME: base
      # Calls out and is never called. Notably it holds no credential for Auth's
      # user and role management: the Base App asks Auth who somebody is, which
      # needs no token, and managing people is the Backoffice's job.
      SIBERIAN_CALLEES: >-
        orchestrator=${SIBERIAN_TOKEN_BASE_ORCHESTRATOR:-dev_base_to_orchestrator},
        mobile=${SIBERIAN_TOKEN_BASE_MOBILE:-dev_base_to_mobile}
    volumes:
      - ../core/base:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  auth:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: auth
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_auth
      SIBERIAN_SERVICE_NAME: auth
      # Only the Backoffice manages people and roles. Asking who somebody is
      # needs no token at all, which is why the Base App is not on this list.
      SIBERIAN_CALLERS: orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_AUTH:-dev_orchestrator_to_auth}
    volumes:
      - ../core/auth:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  mailer:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mailer
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mailer
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_SERVICE_NAME: mailer
      SIBERIAN_CALLERS: orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_MAILER:-dev_orchestrator_to_mailer}
      # Asks the Orchestrator which module answers mail.transport.v1.
      SIBERIAN_CALLEES: orchestrator=${SIBERIAN_TOKEN_MAILER_ORCHESTRATOR:-dev_mailer_to_orchestrator}
    volumes:
      - ../core/mailer:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  # Same image as the mailer, different command. The API and the worker are
  # separate processes so a delivery that hangs cannot take the queue endpoints
  # down with it, and so they restart and scale separately.
  mailer-worker:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mailer
    deploy: *rails_limits
    command: ["bin/worker"]
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mailer
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_SERVICE_NAME: mailer
      SIBERIAN_CALLERS: orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_MAILER:-dev_orchestrator_to_mailer}
      SIBERIAN_CALLEES: orchestrator=${SIBERIAN_TOKEN_MAILER_ORCHESTRATOR:-dev_mailer_to_orchestrator}
      MAILER_POLL_INTERVAL: "${MAILER_POLL_INTERVAL:-5}"
    volumes:
      - ../core/mailer:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  mobile:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mobile
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mobile
      SIBERIAN_SERVICE_NAME: mobile
      # The Base App reads phone app state to draw the product side menu.
      SIBERIAN_CALLERS: >-
        orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_MOBILE:-dev_orchestrator_to_mobile},
        base=${SIBERIAN_TOKEN_BASE_MOBILE:-dev_base_to_mobile}
      # Registers itself with Storage like a module, to keep build artifacts.
      SIBERIAN_CALLEES: storage=${SIBERIAN_TOKEN_MOBILE_STORAGE:-dev_mobile_to_storage}
      # A different trust level gets a different credential. The builder runs
      # third-party module code; the Orchestrator does not.
      SIBERIAN_BUILDER_TOKEN: ${SIBERIAN_BUILDER_TOKEN:-builder_dev_only}
      SIBERIAN_STORAGE_URL: http://storage:3000
      # The assistant that proposes a configuration. Absent, the page says the
      # assistant is not configured and everything else still works: nothing
      # about building an app depends on being able to describe one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../core/mobile:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  # Node rather than Rails, because the thing it drives is an Expo toolchain.
  # One builder shared by every domain, which is why there is a queue: two
  # domains asking at the same moment are two rows, not two containers.
  #
  # It holds no engine socket and no admin token. It claims one build, receives
  # the plan for that build, and can ask this service nothing else.
  mobile-builder:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: core/mobile-builder/Dockerfile
    environment:
      SIBERIAN_MOBILE_URL: http://mobile:3000
      SIBERIAN_STORAGE_URL: http://storage:3000
      SIBERIAN_BUILDER_TOKEN: ${SIBERIAN_BUILDER_TOKEN:-builder_dev_only}
      BUILDER_POLL_INTERVAL: "${BUILDER_POLL_INTERVAL:-10}"
      # Gradle and Metro both assume a home they can write to.
      HOME: /home/builder
    volumes:
      - ../core/mobile-builder:/builder
      # The module catalogue, read only. A module that ships native code ships
      # it in its own directory, and this is where the builder reads it from.
      # Read only because building must never edit what it built from.
      - ../modules:/modules:ro
      - builder_workspace:/workspace
      - builder_cache:/home/builder
    # The one container that genuinely competes for the machine.
    #
    # Gradle and Metro will each take every core they are offered, and this box
    # has two. An unbounded build left Postgres waiting for CPU, which surfaces
    # as the whole product being slow while nothing looks wrong with any of it:
    # the symptom is everywhere and the cause is here.
    #
    # One core, so a build always leaves one for the databases, the Router, and
    # the eleven services in front of them. Builds get slower. That is the
    # intended trade: a build nobody is watching should lose to a page somebody
    # is.
    #
    # The memory ceiling is generous because being killed halfway is worse than
    # being slow, and a Gradle daemon that gets close to it is a build that
    # would have failed anyway.
    deploy:
      resources:
        limits:
          cpus: "${SIBERIAN_BUILDER_CPUS:-1.0}"
          memory: ${SIBERIAN_BUILDER_MEMORY:-3G}
    depends_on:
      mobile:
        condition: service_started
    networks: [core]

  storage:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: storage
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_storage
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ADMIN_ENDPOINT: http://garage:3903
      # Where a browser reaches the object store, which is the Router's s3
      # door. Signed URLs are made against this because the host is part of the
      # signature. Unset it and public media is streamed through this service
      # instead, which still works and simply costs more.
      GARAGE_PUBLIC_ENDPOINT: ${GARAGE_PUBLIC_ENDPOINT:-https://s3.${SIBERIAN_DOMAIN:-siberian.test}}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-storage_service_dev_only}
      SIBERIAN_SERVICE_NAME: storage
      # The Mobile service registers itself here like a module, to store build
      # artifacts, so it is a caller as well as the Orchestrator.
      SIBERIAN_CALLERS: >-
        orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_STORAGE:-dev_orchestrator_to_storage},
        mobile=${SIBERIAN_TOKEN_MOBILE_STORAGE:-dev_mobile_to_storage}
    volumes:
      - ../core/storage:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    # The only service on both networks. This is what keeps the object store
    # unreachable from anything else, modules included.
    networks: [core, storage]

  moduledb:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${MODULEDB_PASSWORD:-moduledb_dev_only}
      POSTGRES_DB: postgres
    volumes:
      - moduledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Joined to each module network at install time, under the alias "db", so a
    # module connects directly with the credentials it was issued. Postgres
    # roles are the isolation, which is what they are for.
    networks: [core]

  database:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: database
    deploy: *rails_limits
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_database
      MODULEDB_ADMIN_URL: postgres://postgres:${MODULEDB_PASSWORD:-moduledb_dev_only}@moduledb:5432/postgres
      CORE_CONFIGURATION_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_configuration
      SIBERIAN_SERVICE_NAME: database
      SIBERIAN_CALLERS: orchestrator=${SIBERIAN_TOKEN_ORCHESTRATOR_DATABASE:-dev_orchestrator_to_database}
      MODULEDB_HOST: db
      MODULEDB_PORT: "5432"
    volumes:
      - ../core/database:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
      moduledb:
        condition: service_healthy
    networks: [core]

  garage:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: dxflrs/garage:v2.3.0
    volumes:
      - ../core/storage/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # No ports published. Nothing outside the storage network reaches this.
    networks: [storage]

volumes:
  router_modules:
  # The builder's scratch space and its package caches. A build that had to
  # download the Android toolchain again every time would be a build nobody
  # waits for.
  builder_workspace:
  builder_cache:
  moduledb_data:
  configuration_data:
  garage_meta:
  garage_data:

networks:
  core:
    name: siberian_core
  storage:
    name: siberian_storage
    internal: true
