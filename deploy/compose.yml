# Development stack. Production topology is deliberately not this file: the
# Orchestrator creates module containers at runtime through the engine driver,
# it does not write compose files.
#
# What lives here is only the core. Modules never appear in this file.

name: siberian

x-rails-build: &rails_build
  context: ..
  dockerfile: deploy/rails.Dockerfile

x-rails-env: &rails_env
  SIBERIAN_DOMAIN: ${SIBERIAN_DOMAIN:-siberian.test}
  SIBERIAN_RESOLVER: ${SIBERIAN_RESOLVER:-127.0.0.11}
  RAILS_ENV: ${RAILS_ENV:-development}

services:
  configuration:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: postgres
    volumes:
      - configuration_data:/var/lib/postgresql/data
      - ../core/configuration/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  router:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: core/router/Dockerfile
    environment:
      SIBERIAN_DOMAIN: ${SIBERIAN_DOMAIN:-siberian.test}
      SIBERIAN_RESOLVER: ${SIBERIAN_RESOLVER:-127.0.0.11}
    ports:
      - "${SIBERIAN_HTTP_PORT:-80}:80"
      - "${SIBERIAN_HTTPS_PORT:-443}:443"
    volumes:
      # Written by the Orchestrator on install, read by nginx after a reload.
      # A shared volume rather than an API, because nginx reads files.
      - router_modules:/etc/nginx/conf.d/modules
      # Generated by bin/generate-certs. Never committed.
      - ../deploy/certs:/etc/nginx/certs:ro
    networks:
      core:
        # Module containers join this network with their short name as alias.
        # The Router resolves them by that alias and never learns the
        # uuid-prefixed container name.
        # The Router answers to three names on the core network: itself, the door
        # modules use to reach the core, and the door core services use to reach
        # a module. It is the only container on both sides, which is why.
        aliases: [router, core, modules]

  orchestrator:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: orchestrator
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_orchestrator
      SIBERIAN_ENGINE: docker
      SIBERIAN_AUTH_URL: http://auth:3000
      SIBERIAN_MAILER_URL: http://mailer:3000
      SIBERIAN_DATABASE_URL_SERVICE: http://database:3000
      SIBERIAN_STORAGE_URL: http://storage:3000
      SIBERIAN_MOBILE_URL: http://mobile:3000
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
      # Joined to every module network so modules can reach Postgres directly.
      SIBERIAN_MODULEDB_CONTAINER: siberian-moduledb-1
      SIBERIAN_ROUTER_CONFIG_DIR: /var/lib/siberian/router
      SIBERIAN_ROUTER_CONTAINER: siberian-router-1
      # Where the Orchestrator looks for installable modules. A directory for
      # now; a registry later. Read only, because installing must never edit
      # the source it installed from.
      SIBERIAN_MODULE_CATALOG: /var/lib/siberian/modules
    volumes:
      - ../core/orchestrator:/app
      - ../lib:/app/lib
      # The Orchestrator drives the engine, so it is the one core service that
      # reaches the daemon. Nothing else gets the socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - router_modules:/var/lib/siberian/router
      - ../modules:/var/lib/siberian/modules:ro
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  base:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: base
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_base
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_AUTH_URL: http://auth:3000
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
    volumes:
      - ../core/base:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  auth:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: auth
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_auth
    volumes:
      - ../core/auth:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  mailer:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mailer
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mailer
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
    volumes:
      - ../core/mailer:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  # Same image as the mailer, different command. The API and the worker are
  # separate processes so a delivery that hangs cannot take the queue endpoints
  # down with it, and so they restart and scale separately.
  mailer-worker:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mailer
    command: ["bin/worker"]
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mailer
      SIBERIAN_ORCHESTRATOR_URL: http://orchestrator:3000
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
      MAILER_POLL_INTERVAL: "${MAILER_POLL_INTERVAL:-5}"
    volumes:
      - ../core/mailer:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  mobile:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: mobile
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_mobile
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
      # A different trust level gets a different credential. The builder runs
      # third-party module code; the Orchestrator does not.
      SIBERIAN_BUILDER_TOKEN: ${SIBERIAN_BUILDER_TOKEN:-builder_dev_only}
      SIBERIAN_STORAGE_URL: http://storage:3000
      # The assistant that proposes a configuration. Absent, the page says the
      # assistant is not configured and everything else still works: nothing
      # about building an app depends on being able to describe one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../core/mobile:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    networks: [core]

  # Node rather than Rails, because the thing it drives is an Expo toolchain.
  # One builder shared by every domain, which is why there is a queue: two
  # domains asking at the same moment are two rows, not two containers.
  #
  # It holds no engine socket and no admin token. It claims one build, receives
  # the plan for that build, and can ask this service nothing else.
  mobile-builder:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: core/mobile-builder/Dockerfile
    environment:
      SIBERIAN_MOBILE_URL: http://mobile:3000
      SIBERIAN_STORAGE_URL: http://storage:3000
      SIBERIAN_BUILDER_TOKEN: ${SIBERIAN_BUILDER_TOKEN:-builder_dev_only}
      BUILDER_POLL_INTERVAL: "${BUILDER_POLL_INTERVAL:-10}"
      # Gradle and Metro both assume a home they can write to.
      HOME: /home/builder
    volumes:
      - ../core/mobile-builder:/builder
      # The module catalogue, read only. A module that ships native code ships
      # it in its own directory, and this is where the builder reads it from.
      # Read only because building must never edit what it built from.
      - ../modules:/modules:ro
      - builder_workspace:/workspace
      - builder_cache:/home/builder
    depends_on:
      mobile:
        condition: service_started
    networks: [core]

  storage:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: storage
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_storage
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ADMIN_ENDPOINT: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-storage_service_dev_only}
    volumes:
      - ../core/storage:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
    # The only service on both networks. This is what keeps the object store
    # unreachable from anything else, modules included.
    networks: [core, storage]

  moduledb:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${MODULEDB_PASSWORD:-moduledb_dev_only}
      POSTGRES_DB: postgres
    volumes:
      - moduledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Joined to each module network at install time, under the alias "db", so a
    # module connects directly with the credentials it was issued. Postgres
    # roles are the isolation, which is what they are for.
    networks: [core]

  database:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    build:
      <<: *rails_build
      args:
        SERVICE: database
    environment:
      <<: *rails_env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_database
      MODULEDB_ADMIN_URL: postgres://postgres:${MODULEDB_PASSWORD:-moduledb_dev_only}@moduledb:5432/postgres
      CORE_CONFIGURATION_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_dev_only}@configuration:5432/siberian_configuration
      SIBERIAN_ADMIN_TOKEN: ${SIBERIAN_ADMIN_TOKEN:-orchestrator_dev_only}
      MODULEDB_HOST: db
      MODULEDB_PORT: "5432"
    volumes:
      - ../core/database:/app
      - ../lib:/app/lib
    depends_on:
      configuration:
        condition: service_healthy
      moduledb:
        condition: service_healthy
    networks: [core]

  garage:
    # The box is a virtual machine on a host that can go down. Without this
    # nothing comes back, and the stack stays off until somebody notices.
    restart: unless-stopped
    image: dxflrs/garage:v2.3.0
    volumes:
      - ../core/storage/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # No ports published. Nothing outside the storage network reaches this.
    networks: [storage]

volumes:
  router_modules:
  # The builder's scratch space and its package caches. A build that had to
  # download the Android toolchain again every time would be a build nobody
  # waits for.
  builder_workspace:
  builder_cache:
  moduledb_data:
  configuration_data:
  garage_meta:
  garage_data:

networks:
  core:
    name: siberian_core
  storage:
    name: siberian_storage
    internal: true
