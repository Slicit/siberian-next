name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # bin/check is the same script developers run locally. If it passes here
      # and fails there, or the reverse, the check is the bug.
      - name: Architecture and convention checks
        run: ./bin/check

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # The shared library has no Rails app to hang a suite on, so it runs here.
      - name: Shared library suite
        run: ./bin/test-lib

  manifest:
    name: Module manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reference modules against the schema
        run: |
          npm install --no-save ajv ajv-formats yaml
          node bin/validate-manifests.js

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orchestrator, base, auth, mailer, storage]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not generated yet
        id: guard
        run: |
          if [ -f "core/${{ matrix.service }}/config/application.rb" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "core/${{ matrix.service }} has no Rails app yet."
          fi

      - uses: ruby/setup-ruby@v1
        if: steps.guard.outputs.present == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: core/${{ matrix.service }}

      - name: Test
        if: steps.guard.outputs.present == 'true'
        working-directory: core/${{ matrix.service }}
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/siberian_${{ matrix.service }}_test
        run: |
          bin/rails db:prepare
          bin/rails test

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [conventions, manifest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Builds only. Publishing happens on a tag, in release.yml.
      - name: Build the Router image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/router/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
