# Headers every internal proxy pass carries.
#
# The domain travels with the request so the Database and Storage services can
# resolve the right per-domain credentials, and so a module never has to be
# told which domain it is serving.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Siberian-Domain $siberian_domain;
proxy_http_version 1.1;
