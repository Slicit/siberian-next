# Headers every user-facing proxy pass carries.
#
# X-Forwarded-Proto is what tells Rails the request arrived over TLS. Without
# it the session cookie is issued without Secure and SameSite=None, and a
# browser then refuses to send it into a module frame on another origin: the
# symptom is a module that cannot tell who you are, which looks nothing like a
# missing header.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Ssl   on;
proxy_set_header X-Siberian-Domain $host;
proxy_http_version 1.1;
