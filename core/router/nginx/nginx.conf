# Router. Gives every installed module a base route and its own origin, and is
# the only container that terminates traffic from outside.
#
# See LOGBOOK.md: modules are reached at <module>.apps.<domain>, which is what
# makes the Base App iframe a browser-enforced boundary. Module to module calls
# do not come through here; those go container to container by network alias.

user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $host "$request" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;

  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Modules reach core services at http://core/..., where the Host is the
  # internal name rather than the domain being served. The domain that matters
  # travels in a header the caller sets, falling back to the served host.
  map $http_x_siberian_domain $siberian_domain {
    default $http_x_siberian_domain;
    ""      $host;
  }

  # Core routes, always present.
  include /etc/nginx/conf.d/00-core.conf;

  # Per-domain core routes: the product shell, the Backoffice, and the object
  # store door, one set per domain in the database. Written by the Orchestrator
  # and converged by RouteReconciler, for the same reason module routes are:
  # how many domains exist is a question only the database can answer, and a
  # file rendered at container start cannot ask it.
  #
  # The directory is under modules/ because that is where the volume the
  # Orchestrator writes to is mounted. The name is a legacy of that mount, not a
  # claim that a domain is a module.
  include /etc/nginx/conf.d/modules/domains/*.conf;

  # Module routes. Written by the Orchestrator on install, update, and removal,
  # then reloaded. Never edited by hand.
  include /etc/nginx/conf.d/modules/*.conf;
}
