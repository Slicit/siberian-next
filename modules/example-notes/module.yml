# Reference module, in PHP.
#
# Its neighbour demo-tasks is in Python. Between them they are the argument for
# the container boundary: the core has no opinion about either, and neither
# imports anything that knows Siberian exists.
schema_version: 1
name: example-notes
version: 1.1.0
title: Notes
description: Markdown notes with full CRUD, written in PHP to show the contract does not care about language.

containers:
  - service: web
    image: siberian/example-notes:1.1.0
    role: http
    internal_port: 8080
    health:
      path: /up
      interval_seconds: 30

routes:
  base: /example-notes
  entry: web
  origin: notes

permissions:
  databases:
    # Its own notes table, one database per domain. The module never sees a
    # credential it was not granted at install time.
    - name: primary
      access: owner
      scope: per_domain

    # A granted read of a table it does not own, named table by table with the
    # reason an operator will see. Every read lands in the audit trail.
    - target: core.configuration
      access: read
      scope: global
      tables:
        - settings
      reason: Reads the product name so the module reads as part of the product rather than a bolt-on.

capabilities:
  # Extends the product the user sees. Listed by the Base App in an area.
  features:
    - id: example_notes.note.viewer
      area: sidebar.entities
      title: Notes
      path: /
      icon: note
